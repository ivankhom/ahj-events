<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goblin Hunt 👺</title>
</head>
<body>
  <div class="game-wrapper">
    <h1 class="title">👺 Goblin Hunt</h1>

    <div class="stats">
      <div class="stat">⚡ Очки: <span id="score">0</span></div>
      <div class="stat">💀 Промахи: <span id="misses">0</span> / 5</div>
    </div>

    <div id="field" class="field"></div>

    <div id="overlay" class="overlay">
      <div class="overlay-content">
        <div class="overlay-title" id="overlay-title">Goblin Hunt</div>
        <div class="overlay-text">Кликай по гоблинам молотком!</div>
        <div class="overlay-result">Твой счёт: <span class="overlay-score">0</span></div>
        <button id="start-btn" class="btn">Начать игру</button>
        <button id="restart-btn" class="btn hidden">Играть снова</button>
      </div>
    </div>
  </div>
</body>
</html>
